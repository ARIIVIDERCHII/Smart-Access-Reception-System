<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Access Portal</title>
    <style>
        :root {
            --bg-admin: #0d1117;
            --bg-map: #090c10;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --border-color: #30363d;
            --success-color: #238636;
        }

        * { padding: 0; margin: 0; box-sizing: border-box; }
        
        body { 
            background-color: black; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow: hidden; 
            transition: background-color 0.5s;
        }

        /* --- Navigation Buttons --- */
        #nav-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        
        .nav-btn {
            background: rgba(0,0,0,0.5);
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        .nav-btn.active {
            color: white;
            border-color: var(--success-color);
            background: rgba(35, 134, 54, 0.2);
        }

        .nav-btn:hover { color: white; border-color: white; }

        /* --- VIEWS --- */
        .view {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
        }

        /* --- Face View --- */
        #face-view { z-index: 1; display: block; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #info { position: absolute; bottom: 50px; width: 100%; text-align: center; z-index: 2; opacity: 0; transition: opacity 1s; }
        h1 { font-size: 3rem; margin-bottom: 10px; letter-spacing: 2px; }
        h2 { font-size: 1.5rem; color: #B829EA; text-transform: uppercase; letter-spacing: 5px; }
        .logo { position: absolute; top: 30px; left: 30px; z-index: 2; font-size: 1.2rem; color: rgba(255,255,255,0.5); font-weight: bold; }

        /* --- Admin View --- */
        #admin-view {
            z-index: 10;
            background-color: var(--bg-admin);
            padding: 5rem 2rem 2rem 2rem;
            overflow-y: auto;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .header h1 { font-size: 1.5rem; font-weight: 600; margin: 0; }
        table { width: 100%; border-collapse: collapse; background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: rgba(255,255,255,0.02); color: #8b949e; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
        .badge { padding: 4px 8px; border-radius: 2rem; font-size: 0.75rem; font-weight: 600; }
        .badge.granted { background-color: rgba(35, 134, 54, 0.2); color: #3fb950; }
        .badge.denied { background-color: rgba(218, 54, 51, 0.2); color: #ff7b72; }
        .badge.unknown { background-color: rgba(210, 153, 34, 0.2); color: #d29922; }
        .action-type { font-weight: bold; font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); margin-right: 10px; }
        .action-type.entry { color: #58a6ff; }
        .action-type.exit { color: #d29922; }

        /* --- Map View --- */
        #map-view {
            z-index: 5;
            background-color: var(--bg-map);
            display: none;
        }
        
        .map-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        
        .zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-top: 5rem;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        
        .zone h1 {
            font-size: 2.5rem;
            color: rgba(255,255,255,0.2);
            text-transform: uppercase;
            letter-spacing: 10px;
        }

        .zone#home-zone { background: radial-gradient(circle at center, #161b22 0%, #090c10 100%); }
        .zone#institute-zone { background: radial-gradient(circle at center, #0d1e36 0%, #090c10 100%); }
        
        /* Avatars */
        #avatars-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .avatar {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 3px solid #58a6ff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: all 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); /* Bouncy entrance animation */
            transform: translate(-50%, -50%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        
        .avatar span {
            position: absolute;
            bottom: -25px;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="nav-container">
        <button class="nav-btn active" onclick="switchView('face')" id="btn-face">Scanner</button>
        <button class="nav-btn" onclick="switchView('map')" id="btn-map">Campus Map</button>
        <button class="nav-btn" onclick="switchView('admin')" id="btn-admin">Analytics</button>
    </div>

    <!-- FACE PORTAL VIEW -->
    <div id="face-view" class="view">
        <div class="logo">AI ACCESS PORTAL</div>
        <div id="info">
            <h1 id="name"></h1>
            <h2 id="status"></h2>
        </div>
        <canvas id="canvas"></canvas>
    </div>

    <!-- MAP VIEW -->
    <div id="map-view" class="view">
        <div class="map-container">
            <div class="zone" id="home-zone">
                <h1>🏠 HOME</h1>
            </div>
            <div class="zone" id="institute-zone">
                <h1>🏫 INSTITUTE</h1>
            </div>
        </div>
        <div id="avatars-layer"></div>
    </div>

    <!-- ADMIN DASHBOARD VIEW -->
    <div id="admin-view" class="view">
        <div class="header">
            <h1>Smart Access Analytics</h1>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Action</th>
                    <th>Identity</th>
                    <th>Temp (°C)</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="logs-body">
            </tbody>
        </table>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        // --- UI Logic ---
        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(viewName + '-view').style.display = 'block';
            document.getElementById('btn-' + viewName).classList.add('active');

            if (viewName === 'admin') {
                document.body.style.backgroundColor = 'var(--bg-admin)';
                document.body.style.overflow = 'auto';
            } else if (viewName === 'map') {
                document.body.style.backgroundColor = 'var(--bg-map)';
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.backgroundColor = 'black';
                document.body.style.overflow = 'hidden';
            }
        }

        // --- Socket.IO Connection ---
        const socket = io();

        socket.on('connect', () => {
            console.log('Подключено к серверу');
            // Запрашиваем состояние карты (кто где)
            socket.emit('request_map_state');
        });

        // --- Campus Map Logic ---
        const avatarsLayer = document.getElementById('avatars-layer');
        const userNodes = {}; // Храним DOM-элементы аватарок
        
        function getZoneCenter(zoneName, index, total) {
            // zoneName = 'HOME' or 'INSTITUTE'
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            const baseX = zoneName === 'HOME' ? w * 0.25 : w * 0.75;
            const baseY = h * 0.5;
            
            // Расставляем аватарки по сетке/кругу, если их много
            const angle = (index / (total || 1)) * Math.PI * 2;
            const radius = total > 1 ? 120 : 0;
            
            return {
                x: baseX + Math.cos(angle) * radius,
                y: baseY + Math.sin(angle) * radius
            };
        }

        socket.on('map_state', function(users) {
            avatarsLayer.innerHTML = '';
            
            const homeUsers = users.filter(u => u.location === 'HOME');
            const instUsers = users.filter(u => u.location === 'INSTITUTE');

            users.forEach(user => {
                const el = document.createElement('div');
                el.className = 'avatar';
                if (user.image) el.style.backgroundImage = `url(${user.image})`;
                el.innerHTML = `<span>${user.name}</span>`;
                
                const group = user.location === 'HOME' ? homeUsers : instUsers;
                const idx = group.indexOf(user);
                
                const pos = getZoneCenter(user.location, idx, group.length);
                el.style.left = pos.x + 'px';
                el.style.top = pos.y + 'px';
                
                avatarsLayer.appendChild(el);
                userNodes[user.name] = el;
            });
        });

        // --- Admin Dashboard Logic ---
        const tbody = document.getElementById('logs-body');

        function createRowHTML(log) {
            const isGranted = log.access_granted;
            
            let badgeClass = isGranted ? 'granted' : 'denied';
            let badgeText = isGranted ? 'ACCESS GRANTED' : 'DENIED';
            if (log.action_type === 'INTRUDER') {
                badgeClass = 'unknown';
                badgeText = 'INTRUDER';
            }

            let actionClass = log.action_type === 'ENTRY' ? 'entry' : 'exit';
            let actionText = log.action_type || 'SYSTEM';

            return `
                <td>${log.timestamp}</td>
                <td><span class="action-type ${actionClass}">${actionText}</span></td>
                <td style="font-weight: 500; color: #fff;">${log.name}</td>
                <td>${log.temperature ? log.temperature + ' °C' : '-'}</td>
                <td><span class="badge ${badgeClass}">${badgeText}</span></td>
            `;
        }

        fetch('/api/logs').then(res => res.json()).then(logs => {
            tbody.innerHTML = '';
            logs.forEach(log => {
                const tr = document.createElement('tr');
                tr.innerHTML = createRowHTML(log);
                tbody.appendChild(tr);
            });
        });

        socket.on('new_log', function(log) {
            const tr = document.createElement('tr');
            tr.className = 'new-row';
            tr.innerHTML = createRowHTML(log);
            tbody.insertBefore(tr, tbody.firstChild);
            if (tbody.children.length > 100) tbody.removeChild(tbody.lastChild);
        });

        // --- Face Portal Logic ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext("2d");
        const infoDiv = document.getElementById('info');
        const nameEl = document.getElementById('name');
        const statusEl = document.getElementById('status');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        let particles = [];
        let pixelSize = 2;

        const render = () => { 
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.fillRect(0, 0, width, height);
            
            for(let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += (p.tx - p.x) * p.speed;
                p.y += (p.ty - p.y) * p.speed;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, pixelSize, pixelSize);
            }
            requestAnimationFrame(render);
        }
        render();

        function createFaceParticles(base64Image) {
            const img = new Image();
            img.onload = () => {
                const targetW = 75; 
                const ratio = img.height / img.width;
                const targetH = Math.floor(targetW * ratio);

                const offCanvas = document.createElement('canvas');
                offCanvas.width = targetW;
                offCanvas.height = targetH;
                const offCtx = offCanvas.getContext('2d');
                offCtx.drawImage(img, 0, 0, targetW, targetH);
                const imgData = offCtx.getImageData(0, 0, targetW, targetH).data;

                const scale = Math.min(width / targetW, height / targetH) * 0.85;
                const offsetX = (width - targetW * scale) / 2;
                const offsetY = (height - targetH * scale) / 2;

                pixelSize = scale + 0.5;

                let newParticles = [];
                const contrast = 40;
                const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
                const step = 255 / 5;

                for (let y = 0; y < targetH; y+=1) {
                    for (let x = 0; x < targetW; x+=1) {
                        const i = (y * targetW + x) * 4;
                        let r = imgData[i];
                        let g = imgData[i+1];
                        let b = imgData[i+2];

                        r = factor * (r - 128) + 128;
                        g = factor * (g - 128) + 128;
                        b = factor * (b - 128) + 128;

                        r = Math.round(Math.max(0, Math.min(255, r)) / step) * step;
                        g = Math.round(Math.max(0, Math.min(255, g)) / step) * step;
                        b = Math.round(Math.max(0, Math.min(255, b)) / step) * step;

                        newParticles.push({
                            x: width / 2 + (Math.random() - 0.5) * width * 1.5,
                            y: height + Math.random() * 800,
                            tx: x * scale + offsetX,
                            ty: y * scale + offsetY,
                            color: `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`,
                            speed: 0.04 + Math.random() * 0.06
                        });
                    }
                }
                newParticles.sort(() => Math.random() - 0.5);
                particles = newParticles;
            };
            img.src = base64Image;
        }

        socket.on('face_recognized', function(data) {
            // Логика для Face View
            nameEl.innerText = data.name + (data.action_type === 'ENTRY' ? " [ARRIVED]" : " [LEFT]");
            statusEl.innerText = data.status;
            infoDiv.style.opacity = 1;
            createFaceParticles(data.image);
            
            // Логика для Map View (анимация перелета)
            if (userNodes[data.name]) {
                const node = userNodes[data.name];
                // Обновляем фото на всякий случай
                node.style.backgroundImage = `url(${data.image})`;
                
                // Рассчитываем новую позицию
                const pos = getZoneCenter(data.location, 0, 1); 
                node.style.left = pos.x + 'px';
                node.style.top = pos.y + 'px';
            }

            setTimeout(() => { infoDiv.style.opacity = 0; }, 8000);
        });

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // Обновляем позиции карты при ресайзе
            socket.emit('request_map_state');
        });
    </script>
</body>
</html>
