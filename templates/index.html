<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Access - Particle Face</title>
    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body { background-color: black; overflow: hidden; color: white; font-family: sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #info { position: absolute; bottom: 50px; width: 100%; text-align: center; z-index: 2; opacity: 0; transition: opacity 1s; }
        h1 { font-size: 3rem; margin-bottom: 10px; letter-spacing: 2px; }
        h2 { font-size: 1.5rem; color: #B829EA; text-transform: uppercase; letter-spacing: 5px; }
        .logo { position: absolute; top: 30px; left: 30px; z-index: 2; font-size: 1.2rem; color: rgba(255,255,255,0.5); font-weight: bold; }
    </style>
</head>
<body>
    <div class="logo">AI ACCESS PORTAL</div>
    <div id="info">
        <h1 id="name"></h1>
        <h2 id="status"></h2>
    </div>
    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext("2d");
        const infoDiv = document.getElementById('info');
        const nameEl = document.getElementById('name');
        const statusEl = document.getElementById('status');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        let particles = [];
        let pixelSize = 2; // Будет вычисляться динамически

        const render = () => { 
            // Полупрозрачный фон для эффекта шлейфа в движении
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.fillRect(0, 0, width, height);
            
            // Отрисовка плотной сетки частиц
            for(let i = 0; i < particles.length; i++) {
                let p = particles[i];
                
                // Плавное приближение к целевой точке (easing)
                p.x += (p.tx - p.x) * p.speed;
                p.y += (p.ty - p.y) * p.speed;
                
                ctx.fillStyle = p.color;
                // Рисуем квадрат размером чуть больше шага сетки, чтобы не было дырок
                ctx.fillRect(p.x, p.y, pixelSize, pixelSize);
            }
            requestAnimationFrame(render);
        }
        
        render();

        function createFaceParticles(base64Image) {
            const img = new Image();
            img.onload = () => {
                // Очень высокое разрешение: 200 пикселей (будет ~50,000 частиц!)
                // Это даст полноценное фотографическое качество
                const targetW = 200;
                const ratio = img.height / img.width;
                const targetH = Math.floor(targetW * ratio);

                const offCanvas = document.createElement('canvas');
                offCanvas.width = targetW;
                offCanvas.height = targetH;
                const offCtx = offCanvas.getContext('2d');
                
                offCtx.drawImage(img, 0, 0, targetW, targetH);
                const imgData = offCtx.getImageData(0, 0, targetW, targetH).data;

                // Вычисляем масштаб для экрана
                const scale = Math.min(width / targetW, height / targetH) * 0.85;
                const offsetX = (width - targetW * scale) / 2;
                const offsetY = (height - targetH * scale) / 2;

                // Размер отрисовываемого пикселя делаем чуть больше масштаба,
                // чтобы они перекрывались и формировали СПЛОШНОЙ портрет без дырок.
                pixelSize = scale + 0.5;

                let newParticles = [];

                // Сканируем КАЖДЫЙ пиксель изображения
                for (let y = 0; y < targetH; y+=1) {
                    for (let x = 0; x < targetW; x+=1) {
                        const i = (y * targetW + x) * 4;
                        const r = imgData[i];
                        const g = imgData[i+1];
                        const b = imgData[i+2];

                        // Берем все цвета, чтобы портрет был полноценным
                        newParticles.push({
                            // Начальная позиция (разброс снизу или с краев экрана)
                            x: width / 2 + (Math.random() - 0.5) * width * 1.5,
                            y: height + Math.random() * 800,
                            // Целевая позиция (где пиксель должен быть в фото)
                            tx: x * scale + offsetX,
                            ty: y * scale + offsetY,
                            color: `rgb(${r},${g},${b})`,
                            // Индивидуальная скорость для красивого разлета
                            speed: 0.04 + Math.random() * 0.06
                        });
                    }
                }
                
                // Перемешиваем, чтобы они собирались хаотично, как пыль
                newParticles.sort(() => Math.random() - 0.5);
                particles = newParticles;
            };
            img.src = base64Image;
        }

        // Инициализация WebSockets
        const socket = io();

        socket.on('connect', () => {
            console.log('Подключено к серверу');
        });

        socket.on('face_recognized', function(data) {
            console.log("Получено лицо:", data.name);
            
            // Обновляем текст
            nameEl.innerText = data.name;
            statusEl.innerText = data.status;
            infoDiv.style.opacity = 1;

            // Запускаем сборку лица из частиц
            createFaceParticles(data.image);

            // Прячем текст через некоторое время
            setTimeout(() => {
                infoDiv.style.opacity = 0;
            }, 8000);
        });

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });
    </script>
</body>
</html>
