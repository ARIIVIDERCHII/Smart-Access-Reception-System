<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Security Dashboard</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --danger-color: #da3633;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--success-color);
            font-weight: 500;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(35, 134, 54, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(35, 134, 54, 0); }
            100% { box-shadow: 0 0 0 0 rgba(35, 134, 54, 0); }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(255,255,255,0.02);
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        tr:last-child td { border-bottom: none; }

        .badge {
            padding: 4px 8px;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge.granted { background-color: rgba(35, 134, 54, 0.2); color: #3fb950; }
        .badge.denied { background-color: rgba(218, 54, 51, 0.2); color: #ff7b72; }
        .badge.unknown { background-color: rgba(210, 153, 34, 0.2); color: #d29922; }

        .temp-normal { color: #3fb950; }
        .temp-high { color: #ff7b72; font-weight: bold; }

        .new-row {
            animation: highlight 2s ease-out;
        }

        @keyframes highlight {
            0% { background-color: rgba(88, 166, 255, 0.2); }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Smart Access Analytics</h1>
        <div class="live-indicator">
            <div class="dot"></div>
            LIVE FEED
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Time</th>
                <th>Identity</th>
                <th>Role</th>
                <th>Temp (°C)</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="logs-body">
            <!-- Data will be loaded here -->
        </tbody>
    </table>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const tbody = document.getElementById('logs-body');

        function createRowHTML(log) {
            const isGranted = log.access_granted;
            const isIntruder = log.status === 'Intruder';
            
            let badgeClass = isGranted ? 'granted' : 'denied';
            let badgeText = isGranted ? 'ACCESS GRANTED' : 'ACCESS DENIED';
            if (isIntruder) {
                badgeClass = 'unknown';
                badgeText = 'INTRUDER DETECTED';
            }

            let tempHTML = '-';
            if (log.temperature) {
                const tempClass = log.temperature > 37.5 ? 'temp-high' : 'temp-normal';
                tempHTML = `<span class="${tempClass}">${log.temperature} °C</span>`;
            }

            return `
                <td>${log.timestamp}</td>
                <td style="font-weight: 500; color: #fff;">${log.name}</td>
                <td style="color: #8b949e;">${log.status}</td>
                <td>${tempHTML}</td>
                <td><span class="badge ${badgeClass}">${badgeText}</span></td>
            `;
        }

        // Загрузка начальных данных через API
        fetch('/api/logs')
            .then(res => res.json())
            .then(logs => {
                tbody.innerHTML = '';
                logs.forEach(log => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = createRowHTML(log);
                    tbody.appendChild(tr);
                });
            });

        // Подключение по сокетам для обновления в реальном времени
        const socket = io('/admin');
        socket.on('new_log', function(log) {
            const tr = document.createElement('tr');
            tr.className = 'new-row';
            tr.innerHTML = createRowHTML(log);
            tbody.insertBefore(tr, tbody.firstChild);
            
            // Удаляем старые записи, чтобы таблица не росла бесконечно
            if (tbody.children.length > 100) {
                tbody.removeChild(tbody.lastChild);
            }
        });
    </script>
</body>
</html>
